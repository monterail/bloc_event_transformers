name: Pull request updated

on:
  pull_request:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up mise
      uses: jdx/mise-action@v2
      with:
        install: true
        cache: true

    - name: Install dependencies
      run: mise run get

    - name: Lint
      run: mise run lint

    - name: Run tests
      run: mise run test
